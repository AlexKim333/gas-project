function cancelPendingModal() {
  const modal = document.getElementById('pendingModal');
  if (modal) modal.style.display = 'none';
  selectedPendingIndex = -1;
}

function toggleScroll() {
  const table = document.getElementById('scrollableTable');
  if (table) {
    table.classList.toggle('scroll-enabled', records.length >= 5);
  }
}

function updateTotals() {
  const totalItemsSpan = document.getElementById('totalItems');
  const totalBoxesLabelSpan = document.getElementById('totalBoxesLabel');
  const totalIndividualsLabelSpan = document.getElementById('totalIndividualsLabel');
  if (!totalItemsSpan || !totalBoxesLabelSpan || !totalIndividualsLabelSpan) return;
  if (currentType === 'product') {
    totalItemsSpan.textContent = records.length;
    totalBoxesLabelSpan.innerText = '';
    totalIndividualsLabelSpan.innerText = '';
  } else {
    const totalItems = new Set(records.map(r => `${r.itemName}_${r.color}`)).size;
    const totalBoxes = records.reduce((sum, r) => sum + (currentType === 'in' ? r.boxQty : Math.abs(r.boxQty)), 0);
    const totalIndividuals = records.reduce((sum, r) => sum + (currentType === 'in' ? r.individualQty : Math.abs(r.individualQty)), 0);
    totalItemsSpan.textContent = totalItems;
    totalBoxesLabelSpan.innerText = `${typeConfig[currentType].totalBoxesLabel}${totalBoxes}`;
    totalIndividualsLabelSpan.innerText = `${typeConfig[currentType].totalIndividualsLabel}${totalIndividuals}`;
  }
}

function handleError(error) {
  alert('오류 발생: ' + error.message);
  const buttonContainer = document.querySelector('#modalButtons .button-container:first-child');
  if (buttonContainer) {
    const originalButton = document.querySelector('.processing-button');
    if (originalButton) originalButton.style.visibility = 'visible';
    if (processingButton && buttonContainer.contains(processingButton)) {
      buttonContainer.removeChild(processingButton);
    }
  }
}

function printReceipt(records, type, selectedDate, admin, invoiceNumber, callback) {
  const iframe = document.getElementById('printFrame');
  if (!iframe) return;
  const doc = iframe.contentWindow.document;
  const formattedDate = selectedDate.replace(/-/g, '/');
  const totalItems = new Set(records.map(r => `${r.itemName}_${r.color}`)).size;
  const totalBoxes = records.reduce((sum, r) => sum + Math.abs(r.boxQty), 0);
  const totalIndividuals = records.reduce((sum, r) => sum + Math.abs(r.individualQty), 0);
  const rowsPerPage = 15;
  const pages = Math.ceil(records.length / rowsPerPage);
  const title = type === 'in' ? 'COMPROBANTE DE ENTRADA' : 'COMPROBANTE DE SALIDA';
  const titleColor = type === 'in' ? 'red' : 'black';
  const adminColor = admin === 'ADMIN' ? 'black' : 'green';
  const adminStyle = `font-size: 11pt; color: ${adminColor};`;
  let htmlContent = '';
  const locationValue = records.length > 0 ? records[0].location : '미지정';
  for (let page = 0; page < pages; page++) {
    const startIdx = page * rowsPerPage;
    const endIdx = Math.min(startIdx + rowsPerPage, records.length);
    const pageRecords = records.slice(startIdx, endIdx);
    let tableRows = '<tr><th>PRODUCTO</th><th>COLOR</th><th>BULTO</th><th>PZS</th><th>PZS/B</th><th>TOTAL</th></tr>';
    for (let i = 0; i < 15; i++) {
      if (i < pageRecords.length) {
        const rec = pageRecords[i];
        const boxQty = Math.abs(rec.boxQty);
        const individualQty = Math.abs(rec.individualQty);
        const boxContent = rec.boxContent || 0;
        const totalIndividual = (boxQty * boxContent) + individualQty;
        tableRows += `<tr><td>${rec.itemName}</td><td>${rec.color}</td><td>${boxQty}</td><td>${individualQty}</td><td>${boxContent}</td><td>${totalIndividual}</td></tr>`;
      } else {
        tableRows += `<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }
    }
    const summaryTable = page === 0 ? `
      <table class="summary-table">
        <tr><th>cant item</th><th>cant bulto</th><th>cant pzs</th></tr>
        <tr><td>${totalItems}</td><td>${totalBoxes}</td><td>${totalIndividuals}</td></tr>
      </table>
    ` : '';
    htmlContent += `
      <div class="page">
        <div class="receipt-container">
          <div class="receipt">
            <div class="header" style="color: ${titleColor};">${title}</div>
            <div class="details">
              <p>No: ${invoiceNumber}</p>
              <p>fetcha: ${formattedDate}</p>
              <p class="location">UBICACION: <span class="location-value">${locationValue}</span></p>
              <p class="admin">VENDEDOR: <span style="${adminStyle}">${admin}</span></p>
              ${summaryTable}
            </div>
            <table class="main-table">${tableRows}</table>
            <div class="footer">
              <span>ANIMO!!!</span>
              <span class="page-number">${page + 1}-${pages}</span>
            </div>
          </div>
          <div class="receipt">
            <div class="header" style="color: ${titleColor};">${title}</div>
            <div class="details">
              <p>No: ${invoiceNumber}</p>
              <p>fetcha: ${formattedDate}</p>
              <p class="location">UBICACION: <span class="location-value">${locationValue}</span></p>
              <p class="admin">VENDEDOR: <span style="${adminStyle}">${admin}</span></p>
              ${summaryTable}
            </div>
            <table class="main-table">${tableRows}</table>
            <div class="footer">
              <span>ANIMO!!!</span>
              <span class="page-number">${page + 1}-${pages}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }
  doc.open();
  doc.write(`
    <html>
      <head>
        <style>
          @page { size: letter landscape; margin: 0.5in; margin-bottom: 1in; }
          body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
          .page { width: 100%; height: 7.5in; display: flex; justify-content: center; align-items: center; page-break-after: always; margin-bottom: 0.5in; }
          .receipt-container { display: flex; justify-content: space-between; width: 10in; margin-top: 0.2in; }
          .receipt { width: 4.75in; border: 1px solid #000; padding: 0.1in; box-sizing: border-box; margin-bottom: 0.2in; }
          .header { text-align: center; font-weight: bold; font-size: 14pt; margin-bottom: 0.2in; }
          .details { font-size: 10pt; margin-bottom: 0.2in; }
          .details p { margin: 0.05in 0; }
          .location { font-size: 10pt; font-weight: bold; text-decoration: underline; }
          .location-value { color: blue; font-size: 13pt; }
          .admin { font-size: 9pt; font-weight: bold; }
          .summary-table { width: 60%; margin: 0.1in auto; border-collapse: collapse; font-size: 10pt; }
          .summary-table th, .summary-table td { border: 1px solid #000; padding: 0.05in; text-align: center; }
          .summary-table th { background-color: #f2f2f2; font-weight: bold; }
          .main-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
          .main-table th, .main-table td { border: 1px solid #000; padding: 0.05in; text-align: center; height: 0.3in; }
          .main-table th { background-color: #f2f2f2; font-weight: bold; }
          .footer { text-align: center; font-size: 10pt; margin-top: 0.2in; display: flex; justify-content: space-between; align-items: center; }
          .page-number { font-weight: bold; }
        </style>
      </head>
      <body>${htmlContent}</body>
    </html>
  `);
  doc.close();
  iframe.contentWindow.focus();
  setTimeout(() => {
    iframe.contentWindow.print();
    setTimeout(() => {
      if (typeof callback === 'function') {
        callback();
      }
    }, 3000);
  }, 500);
}

function setupDropdownEvents() {
  const itemNameInput = document.getElementById('itemName');
  if (itemNameInput) {
    itemNameInput.addEventListener('blur', () => setTimeout(hideCustomDropdown, 100));
  }
  document.addEventListener('click', e => {
    const dropdown = document.getElementById('customDropdown');
    const itemName = document.getElementById('itemName');
    if (dropdown && itemName && !itemName.contains(e.target) && !dropdown.contains(e.target)) {
      hideCustomDropdown();
    }
  });
}

function setupMetadataEvents() {
  const adminSelect = document.getElementById('adminSelect');
  if (adminSelect) adminSelect.addEventListener('change', saveMetadata);
}

// =======================================================
// 3대 고속 핫키 시스템 자바스크립트 (출고처 / 베스트셀러 / 그리드)
// =======================================================

const HOTKEY_STORAGE_KEYS = {
  LOCATION: 'wms_hotkeys_locations',
  BESTSELLER: 'wms_hotkeys_bestsellers',
  GRID: 'wms_hotkeys_grid'
};

let hotkeyLocations = [];
let hotkeyBestsellers = [];
let hotkeyGridItems = [];
let currentConfigType = 'location';
let activeGridVariants = [];
let currentActiveHotkeyTab = 'location';

function initAllHotkeys() {
  initLocationHotkeys();
  initProductHotkeys();
  setupHotkeyShortcuts();
}

// ---------------- 핫키 탭 전환 ----------------

function switchHotkeyTab(tabName) {
  currentActiveHotkeyTab = tabName;
  ['location', 'bestseller', 'grid'].forEach(tab => {
    const btn = document.getElementById(`tabBtn_${tab}`);
    const panel = document.getElementById(`hotkeyPanel_${tab}`);
    if (btn) {
      if (tab === tabName) btn.classList.add('active');
      else btn.classList.remove('active');
    }
    if (panel) {
      if (tab === tabName) {
        panel.style.display = 'block';
        panel.classList.add('active');
      } else {
        panel.style.display = 'none';
        panel.classList.remove('active');
      }
    }
  });
}

function openCurrentHotkeyConfig() {
  openHotkeyConfigModal(currentActiveHotkeyTab);
}

// ---------------- 출고/입고처 핫키 ----------------

function initLocationHotkeys() {
  try {
    const saved = localStorage.getItem(HOTKEY_STORAGE_KEYS.LOCATION);
    if (saved) {
      hotkeyLocations = JSON.parse(saved);
    } else {
      autoPopulateLocationHotkeys();
    }
  } catch (e) {
    autoPopulateLocationHotkeys();
  }
  renderLocationHotkeys();
  highlightActiveLocationButton();
}

function autoPopulateLocationHotkeys() {
  hotkeyLocations = [];
  if (Array.isArray(locationCache) && locationCache.length > 0) {
    for (let i = 0; i < 8; i++) {
      hotkeyLocations.push(locationCache[i] || '');
    }
  } else {
    for (let i = 0; i < 8; i++) hotkeyLocations.push('');
  }
  try {
    localStorage.setItem(HOTKEY_STORAGE_KEYS.LOCATION, JSON.stringify(hotkeyLocations));
  } catch (e) {}
}

function renderLocationHotkeys() {
  const grid = document.getElementById('locationHotkeyGrid');
  if (!grid) return;
  let html = '';
  for (let i = 0; i < 8; i++) {
    const loc = hotkeyLocations[i] || '';
    const isEmpty = !loc;
    html += `
      <button type="button" class="hotkey-btn ${isEmpty ? 'empty' : ''}" 
        id="locBtn_${i}"
        onclick="selectLocationHotkey(${i})" 
        oncontextmenu="event.preventDefault(); openHotkeyConfigModal('location');"
        title="${loc ? `${i + 1}번 거래처 선택 (Alt+${i + 1})` : '클릭하여 거래처 설정'}">
        <div class="btn-text"><span class="btn-num">${i + 1}.</span>${loc || '+ 슬롯 설정'}</div>
      </button>
    `;
  }
  grid.innerHTML = html;
  highlightActiveLocationButton();
}

function selectLocationHotkey(idx) {
  const loc = hotkeyLocations[idx];
  if (!loc) {
    openHotkeyConfigModal('location');
    return;
  }
  const select = document.getElementById('location');
  if (!select) return;

  // 옵션에 없으면 동적 추가
  if (!Array.from(select.options).some(opt => opt.value === loc)) {
    const newOpt = document.createElement('option');
    newOpt.value = loc;
    newOpt.text = loc;
    select.add(newOpt);
  }
  select.value = loc;
  saveMetadata();
  highlightActiveLocationButton();
}

function highlightActiveLocationButton() {
  const select = document.getElementById('location');
  const activeLoc = select ? select.value : '';
  for (let i = 0; i < 8; i++) {
    const btn = document.getElementById(`locBtn_${i}`);
    if (btn) {
      if (activeLoc && hotkeyLocations[i] === activeLoc) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
  }
}

// ---------------- 상품 핫키 (베스트셀러 & 그리드) ----------------

function initProductHotkeys() {
  initBestsellerHotkeys();
  initGridHotkeys();
}

function initBestsellerHotkeys() {
  try {
    const saved = localStorage.getItem(HOTKEY_STORAGE_KEYS.BESTSELLER);
    if (saved) {
      hotkeyBestsellers = JSON.parse(saved);
    } else {
      autoPopulateBestsellerHotkeys();
    }
  } catch (e) {
    autoPopulateBestsellerHotkeys();
  }
  renderBestsellerHotkeys();
}

function autoPopulateBestsellerHotkeys() {
  hotkeyBestsellers = [];
  if (Array.isArray(stockDataCache) && stockDataCache.length > 0) {
    for (let i = 0; i < Math.min(8, stockDataCache.length); i++) {
      const item = stockDataCache[i];
      hotkeyBestsellers.push({
        name: item.name,
        color: item.color,
        boxContent: item.boxContent
      });
    }
  }
  while (hotkeyBestsellers.length < 8) {
    hotkeyBestsellers.push(null);
  }
  try {
    localStorage.setItem(HOTKEY_STORAGE_KEYS.BESTSELLER, JSON.stringify(hotkeyBestsellers));
  } catch (e) {}
}

function renderBestsellerHotkeys() {
  const grid = document.getElementById('bestsellerHotkeyGrid');
  if (!grid) return;
  let html = '';
  for (let i = 0; i < 8; i++) {
    const item = hotkeyBestsellers[i];
    const hasItem = item && item.name;
    html += `
      <button type="button" class="hotkey-btn ${!hasItem ? 'empty' : ''}" 
        onclick="selectBestsellerHotkey(${i})"
        oncontextmenu="event.preventDefault(); openHotkeyConfigModal('bestseller');"
        title="${hasItem ? `${item.name} (${item.color}) 선택` : '클릭하여 베스트셀러 설정'}">
        <div class="btn-text"><span class="btn-num">${i + 1}.</span>${hasItem ? item.name : '+ 슬롯 설정'}</div>
        ${hasItem ? `<div class="btn-sub">${item.color} (${item.boxContent}入)</div>` : ''}
      </button>
    `;
  }
  grid.innerHTML = html;
}

function selectBestsellerHotkey(idx) {
  const item = hotkeyBestsellers[idx];
  if (!item || !item.name) {
    openHotkeyConfigModal('bestseller');
    return;
  }
  const itemNameInput = document.getElementById('itemName');
  const colorInput = document.getElementById('color');
  const boxContentInput = document.getElementById('boxContent');
  const qtyInput = document.getElementById('qty');

  if (itemNameInput) itemNameInput.value = item.name;
  if (colorInput) colorInput.value = item.color || 'SURTIDO';
  if (boxContentInput) boxContentInput.value = item.boxContent || '';
  if (qtyInput) {
    qtyInput.focus();
    qtyInput.select();
  }
}

// ---------------- 그리드 묶음 상품 핫키 ----------------

function initGridHotkeys() {
  try {
    const saved = localStorage.getItem(HOTKEY_STORAGE_KEYS.GRID);
    if (saved) {
      hotkeyGridItems = JSON.parse(saved);
    } else {
      autoPopulateGridHotkeys();
    }
  } catch (e) {
    autoPopulateGridHotkeys();
  }
  renderGridHotkeys();
}

function autoPopulateGridHotkeys() {
  hotkeyGridItems = [];
  if (Array.isArray(stockDataCache) && stockDataCache.length > 0) {
    const groupCount = {};
    stockDataCache.forEach(item => {
      groupCount[item.name] = (groupCount[item.name] || 0) + 1;
    });
    // 변형 컬러가 많은 순으로 정렬
    const sortedNames = Object.keys(groupCount).sort((a, b) => groupCount[b] - groupCount[a]);
    for (let i = 0; i < Math.min(8, sortedNames.length); i++) {
      hotkeyGridItems.push(sortedNames[i]);
    }
  }
  while (hotkeyGridItems.length < 8) {
    hotkeyGridItems.push('');
  }
  try {
    localStorage.setItem(HOTKEY_STORAGE_KEYS.GRID, JSON.stringify(hotkeyGridItems));
  } catch (e) {}
}

function renderGridHotkeys() {
  const grid = document.getElementById('gridHotkeyGrid');
  if (!grid) return;
  let html = '';
  for (let i = 0; i < 8; i++) {
    const itemName = hotkeyGridItems[i] || '';
    const hasItem = Boolean(itemName);
    const variantCount = hasItem ? stockDataCache.filter(item => item.name === itemName).length : 0;
    html += `
      <button type="button" class="hotkey-btn ${!hasItem ? 'empty' : ''}" 
        onclick="openGridSelectionModal(${i})"
        oncontextmenu="event.preventDefault(); openHotkeyConfigModal('grid');"
        title="${hasItem ? `${itemName} (${variantCount}개 컬러) 일괄입력 열기` : '클릭하여 그리드 상품 설정'}">
        <div class="btn-text"><span class="btn-num">${i + 1}.</span>${hasItem ? itemName : '+ 슬롯 설정'}</div>
        ${hasItem ? `<div class="btn-sub" style="color: #00897b; font-weight: bold;">${variantCount}개 컬러 일괄입력</div>` : ''}
      </button>
    `;
  }
  grid.innerHTML = html;
}

// ---------------- 그리드 선택 모달 대화상자 ----------------

function openGridSelectionModal(idx) {
  const itemName = hotkeyGridItems[idx];
  if (!itemName) {
    openHotkeyConfigModal('grid');
    return;
  }
  const locationSelect = document.getElementById('location');
  const loc = locationSelect ? locationSelect.value : '';
  if (!loc) {
    alert('먼저 상단의 입/출고처를 선택해 주세요.');
    if (locationSelect) locationSelect.focus();
    return;
  }

  activeGridVariants = stockDataCache.filter(item => item.name === itemName);
  if (activeGridVariants.length === 0) {
    alert(`[${itemName}] 상품의 재고 정보를 찾을 수 없습니다.`);
    return;
  }

  document.getElementById('gridActiveItemName').textContent = itemName;
  document.getElementById('gridActiveLocationBadge').textContent = (currentType === 'in' ? '입고처: ' : '출고처: ') + loc;

  const tbody = document.getElementById('gridTableBody');
  let html = '';
  activeGridVariants.forEach((v, vIdx) => {
    html += `
      <tr>
        <td style="font-weight: bold; text-align: left; padding-left: 10px;">${v.color}</td>
        <td>${v.boxContent}개입</td>
        <td style="color: #555;">${v.stockBox}상자 (${v.stockIndividual}개)</td>
        <td><input type="number" min="0" class="grid-input" id="gridBox_${vIdx}" oninput="calcGridRowTotal(${vIdx})" placeholder="0"></td>
        <td><input type="number" min="0" class="grid-input" id="gridInd_${vIdx}" oninput="calcGridRowTotal(${vIdx})" placeholder="0"></td>
        <td id="gridRowTotal_${vIdx}" style="font-weight: bold; color: #1976d2;">0개</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
  calcGridOverallTotal();

  const modal = document.getElementById('gridSelectionModal');
  if (modal) modal.style.display = 'flex';

  setTimeout(() => {
    const firstInput = document.getElementById('gridBox_0');
    if (firstInput) firstInput.focus();
  }, 100);
}

function calcGridRowTotal(vIdx) {
  const boxInput = document.getElementById(`gridBox_${vIdx}`);
  const indInput = document.getElementById(`gridInd_${vIdx}`);
  const boxVal = boxInput ? (parseInt(boxInput.value, 10) || 0) : 0;
  const indVal = indInput ? (parseInt(indInput.value, 10) || 0) : 0;
  const boxContent = activeGridVariants[vIdx] ? (activeGridVariants[vIdx].boxContent || 1) : 1;

  const totalPieces = (boxVal * boxContent) + indVal;
  const totalCell = document.getElementById(`gridRowTotal_${vIdx}`);
  if (totalCell) totalCell.textContent = totalPieces + '개';

  calcGridOverallTotal();
}

function calcGridOverallTotal() {
  let totalBoxes = 0;
  let totalIndividuals = 0;
  let totalPieces = 0;

  activeGridVariants.forEach((v, vIdx) => {
    const boxInput = document.getElementById(`gridBox_${vIdx}`);
    const indInput = document.getElementById(`gridInd_${vIdx}`);
    const box = boxInput ? (parseInt(boxInput.value, 10) || 0) : 0;
    const ind = indInput ? (parseInt(indInput.value, 10) || 0) : 0;
    const boxContent = v.boxContent || 1;

    totalBoxes += box;
    totalIndividuals += ind;
    totalPieces += (box * boxContent) + ind;
  });

  const totalBoxSpan = document.getElementById('gridTotalBox');
  const totalIndSpan = document.getElementById('gridTotalInd');
  const totalPiecesSpan = document.getElementById('gridTotalPieces');

  if (totalBoxSpan) totalBoxSpan.textContent = totalBoxes;
  if (totalIndSpan) totalIndSpan.textContent = totalIndividuals;
  if (totalPiecesSpan) totalPiecesSpan.textContent = totalPieces;
}

function submitGridSelection() {
  const locationSelect = document.getElementById('location');
  const location = locationSelect ? locationSelect.value : '';
  let addedCount = 0;

  for (let vIdx = 0; vIdx < activeGridVariants.length; vIdx++) {
    const v = activeGridVariants[vIdx];
    const boxInput = document.getElementById(`gridBox_${vIdx}`);
    const indInput = document.getElementById(`gridInd_${vIdx}`);
    const boxQty = boxInput ? (parseInt(boxInput.value, 10) || 0) : 0;
    const indQty = indInput ? (parseInt(indInput.value, 10) || 0) : 0;

    // 출고 시 사전 재고 검증
    if (currentType === 'out') {
      if (boxQty > 0) {
        const stockInfo = checkItemAndStock(v.name, v.color, v.boxContent, boxQty, 'box');
        if (!stockInfo.isSufficient) {
          alert(`[${v.color}] 박스 재고가 부족합니다. (현재: ${v.stockBox}상자, 요청: ${boxQty}상자)`);
          if (boxInput) boxInput.focus();
          return;
        }
      }
      if (indQty > 0) {
        const stockInfo = checkItemAndStock(v.name, v.color, v.boxContent, indQty, 'individual');
        if (!stockInfo.isSufficient) {
          alert(`[${v.color}] 낱개 재고가 부족합니다. (요청: ${indQty}개)`);
          if (indInput) indInput.focus();
          return;
        }
      }
    }

    if (boxQty > 0) {
      records.push({
        itemName: v.name,
        color: v.color,
        boxQty: boxQty,
        individualQty: 0,
        boxContent: v.boxContent,
        location: location,
        unitType: 'box'
      });
      addedCount++;
    }
    if (indQty > 0) {
      records.push({
        itemName: v.name,
        color: v.color,
        boxQty: 0,
        individualQty: indQty,
        boxContent: v.boxContent,
        location: location,
        unitType: 'individual'
      });
      addedCount++;
    }
  }

  if (addedCount === 0) {
    alert('수량을 1개 이상 입력해 주세요.');
    return;
  }

  saveTableData();
  updateTable();
  toggleScroll();
  updateTotals();
  closeGridSelectionModal();
  alert(`총 ${addedCount}개 품목(색상)이 일괄 추가되었습니다.`);
}

function closeGridSelectionModal() {
  const modal = document.getElementById('gridSelectionModal');
  if (modal) modal.style.display = 'none';
}

// ---------------- 핫키 슬롯 설정 모달 (동적 입력 검색 매트릭스) ----------------

let configActiveSlotIndex = 0; // 현재 배정할 대상 슬롯 (0 ~ 7)
let configTempSlots = [];      // 모달 내에서 편집 중인 8개 슬롯 임시 배열
let currentLiveSearchQuery = '';

function openHotkeyConfigModal(type) {
  currentConfigType = type || currentActiveHotkeyTab || 'location';
  const modal = document.getElementById('hotkeyConfigModal');
  const title = document.getElementById('configModalTitle');
  if (!modal || !title) return;

  if (currentConfigType === 'location') {
    title.textContent = (currentType === 'in' ? '🏢 빠른 입고처' : '🏢 빠른 출고처') + ' 핫키 슬롯 설정 (8개)';
    configTempSlots = [...(hotkeyLocations || [])];
    while (configTempSlots.length < 8) configTempSlots.push('');
  } else if (currentConfigType === 'bestseller') {
    title.textContent = '⭐ 베스트셀러 단일 품목 슬롯 설정 (8개)';
    configTempSlots = (hotkeyBestsellers || []).map(item => item ? { ...item } : null);
    while (configTempSlots.length < 8) configTempSlots.push(null);
  } else if (currentConfigType === 'grid') {
    title.textContent = '📦 그리드 묶음 대표 상품 슬롯 설정 (8개)';
    configTempSlots = [...(hotkeyGridItems || [])];
    while (configTempSlots.length < 8) configTempSlots.push('');
  }

  // 첫 번째 비어있는 슬롯 자동 포커스
  let firstEmpty = configTempSlots.findIndex(s => !s || (typeof s === 'string' && !s.trim()));
  configActiveSlotIndex = firstEmpty !== -1 ? firstEmpty : 0;
  currentLiveSearchQuery = '';

  const searchInput = document.getElementById('cfgLiveSearchInput');
  if (searchInput) {
    searchInput.value = '';
    searchInput.placeholder = currentConfigType === 'location' 
      ? '🔍 거래처명 실시간 검색 (타이핑 시 즉시 필터링)...' 
      : '🔍 품목명 / 코드 실시간 검색 (타이핑 시 즉시 필터링)...';
  }

  renderConfigSlotChips();
  renderConfigSearchMatrix();

  modal.style.display = 'flex';
  setTimeout(() => {
    if (searchInput) searchInput.focus();
  }, 100);
}

function selectActiveConfigSlot(index) {
  configActiveSlotIndex = index;
  renderConfigSlotChips();
  renderConfigSearchMatrix();
  const searchInput = document.getElementById('cfgLiveSearchInput');
  if (searchInput) searchInput.focus();
}

function clearSingleConfigSlot(index, event) {
  if (event) event.stopPropagation();
  configTempSlots[index] = currentConfigType === 'bestseller' ? null : '';
  renderConfigSlotChips();
  renderConfigSearchMatrix();
}

function clearAllHotkeySlots() {
  if (!confirm('8개 슬롯을 모두 비우시겠습니까?')) return;
  for (let i = 0; i < 8; i++) {
    configTempSlots[i] = currentConfigType === 'bestseller' ? null : '';
  }
  configActiveSlotIndex = 0;
  renderConfigSlotChips();
  renderConfigSearchMatrix();
}

function renderConfigSlotChips() {
  const container = document.getElementById('configSlotChipsGrid');
  if (!container) return;
  let html = '';

  for (let i = 0; i < 8; i++) {
    const slotData = configTempSlots[i];
    const isActive = (i === configActiveSlotIndex);
    let label = '(비어있음)';
    let sub = '';
    let hasVal = false;

    if (currentConfigType === 'location') {
      if (slotData && slotData.trim()) {
        label = slotData;
        hasVal = true;
      }
    } else if (currentConfigType === 'bestseller') {
      if (slotData && slotData.name) {
        label = slotData.name;
        sub = `${slotData.color || 'SURTIDO'} (${slotData.boxContent || 0}入)`;
        hasVal = true;
      }
    } else if (currentConfigType === 'grid') {
      if (slotData && slotData.trim()) {
        label = slotData;
        const count = (stockDataCache || []).filter(item => item.name === slotData).length;
        sub = `${count}컬러`;
        hasVal = true;
      }
    }

    html += `
      <div class="cfg-slot-chip ${isActive ? 'active' : ''} ${hasVal ? 'filled' : 'empty'}" onclick="selectActiveConfigSlot(${i})" title="클릭하여 ${i + 1}번 슬롯 선택">
        <div class="cfg-chip-num">${i + 1}</div>
        <div class="cfg-chip-info">
          <div class="cfg-chip-text">${label}</div>
          ${sub ? `<div class="cfg-chip-sub">${sub}</div>` : ''}
        </div>
        ${hasVal ? `<button type="button" class="cfg-chip-del-btn" onclick="clearSingleConfigSlot(${i}, event)" title="이 슬롯 비우기">✕</button>` : ''}
      </div>
    `;
  }
  container.innerHTML = html;
}

function onLiveSearchInput(val) {
  currentLiveSearchQuery = (val || '').trim().toLowerCase();
  renderConfigSearchMatrix();
}

function clearLiveSearch() {
  const searchInput = document.getElementById('cfgLiveSearchInput');
  if (searchInput) {
    searchInput.value = '';
    searchInput.focus();
  }
  currentLiveSearchQuery = '';
  renderConfigSearchMatrix();
}

function renderConfigSearchMatrix() {
  const container = document.getElementById('configMatrixContainer');
  const countSpan = document.getElementById('cfgMatrixResultCount');
  if (!container) return;

  const query = currentLiveSearchQuery;

  if (currentConfigType === 'location') {
    const locList = locationCache || [];
    const itemsToRender = locList.filter(loc => !query || loc.toLowerCase().includes(query));
    if (countSpan) countSpan.textContent = `거래처 검색 결과: ${itemsToRender.length}개`;

    if (itemsToRender.length === 0) {
      container.innerHTML = `<div class="cfg-no-results">일치하는 거래처가 없습니다.</div>`;
      return;
    }

    let html = '<div class="cfg-matrix-grid-loc">';
    itemsToRender.forEach(loc => {
      const assignedSlot = configTempSlots.findIndex(s => s === loc);
      const isAssigned = (assignedSlot !== -1);
      html += `
        <div class="cfg-item-card-loc ${isAssigned ? 'assigned' : ''}" onclick="assignLocationToSlot('${loc.replace(/'/g, "\\'")}')">
          <div class="cfg-card-name">${loc}</div>
          ${isAssigned ? `<span class="cfg-card-assigned-badge">슬롯 ${assignedSlot + 1}</span>` : `<span class="cfg-card-assign-hint">+ 슬롯 ${configActiveSlotIndex + 1}</span>`}
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;

  } else if (currentConfigType === 'bestseller') {
    const stockList = stockDataCache || [];
    const itemsToRender = stockList.filter(item => {
      if (!query) return true;
      return (item.name && item.name.toLowerCase().includes(query)) ||
             (item.color && item.color.toLowerCase().includes(query));
    });
    if (countSpan) countSpan.textContent = `베스트셀러 품목: ${itemsToRender.length}개`;

    if (itemsToRender.length === 0) {
      container.innerHTML = `<div class="cfg-no-results">일치하는 품목이 없습니다.</div>`;
      return;
    }

    let html = '<div class="cfg-matrix-grid">';
    itemsToRender.slice(0, 80).forEach(item => {
      const assignedSlot = configTempSlots.findIndex(s => s && s.name === item.name && s.color === item.color && s.boxContent === item.boxContent);
      const isAssigned = (assignedSlot !== -1);
      html += `
        <div class="cfg-item-card ${isAssigned ? 'assigned' : ''}" onclick="assignBestsellerToSlot('${item.name.replace(/'/g, "\\'")}', '${(item.color || 'SURTIDO').replace(/'/g, "\\'")}', ${item.boxContent || 0})">
          <div class="cfg-card-top">
            <span class="cfg-card-name">${item.name}</span>
            <span class="cfg-card-color">${item.color}</span>
          </div>
          <div class="cfg-card-bottom">
            <span class="cfg-card-boxcnt">📦 ${item.boxContent}개입</span>
            <span class="cfg-card-stock">재고: <strong>${item.stockBox}</strong>상자 (${item.stockIndividual}개)</span>
            ${isAssigned ? `<span class="cfg-card-assigned-badge">슬롯 ${assignedSlot + 1}</span>` : `<span class="cfg-card-assign-hint">+ 슬롯 ${configActiveSlotIndex + 1}</span>`}
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;

  } else if (currentConfigType === 'grid') {
    const stockList = stockDataCache || [];
    const uniqueNames = Array.from(new Set(stockList.map(item => item.name))).filter(Boolean);
    const itemsToRender = uniqueNames.filter(uName => !query || uName.toLowerCase().includes(query));
    if (countSpan) countSpan.textContent = `그리드 품목: ${itemsToRender.length}개`;

    if (itemsToRender.length === 0) {
      container.innerHTML = `<div class="cfg-no-results">일치하는 품목이 없습니다.</div>`;
      return;
    }

    let html = '<div class="cfg-matrix-grid">';
    itemsToRender.slice(0, 80).forEach(uName => {
      const variants = stockList.filter(item => item.name === uName);
      const variantCount = variants.length;
      const totalBoxes = variants.reduce((sum, v) => sum + (v.stockBox || 0), 0);
      const totalInd = variants.reduce((sum, v) => sum + (v.stockIndividual || 0), 0);
      const sampleColors = variants.slice(0, 3).map(v => v.color).join(', ');
      const assignedSlot = configTempSlots.findIndex(s => s === uName);
      const isAssigned = (assignedSlot !== -1);

      html += `
        <div class="cfg-item-card ${isAssigned ? 'assigned' : ''}" onclick="assignGridToSlot('${uName.replace(/'/g, "\\'")}')">
          <div class="cfg-card-top">
            <span class="cfg-card-name">${uName}</span>
            <span class="cfg-card-badge-count">${variantCount}개 컬러</span>
          </div>
          <div class="cfg-card-colors-preview">색상: ${sampleColors}${variantCount > 3 ? ' 외' : ''}</div>
          <div class="cfg-card-bottom">
            <span class="cfg-card-stock">총재고: <strong>${totalBoxes}</strong>박스 + <strong>${totalInd}</strong>개</span>
            ${isAssigned ? `<span class="cfg-card-assigned-badge">슬롯 ${assignedSlot + 1}</span>` : `<span class="cfg-card-assign-hint">+ 슬롯 ${configActiveSlotIndex + 1}</span>`}
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  }
}

function advanceToNextSlot() {
  let next = -1;
  // 현재 슬롯 이후 빈 슬롯 탐색
  for (let i = configActiveSlotIndex + 1; i < 8; i++) {
    const s = configTempSlots[i];
    if (!s || (typeof s === 'string' && !s.trim())) {
      next = i;
      break;
    }
  }
  // 처음부터 탐색
  if (next === -1) {
    for (let i = 0; i < 8; i++) {
      const s = configTempSlots[i];
      if (!s || (typeof s === 'string' && !s.trim())) {
        next = i;
        break;
      }
    }
  }
  // 빈 슬롯이 없으면 순환
  configActiveSlotIndex = (next !== -1) ? next : ((configActiveSlotIndex + 1) % 8);
  renderConfigSlotChips();
  renderConfigSearchMatrix();

  const searchInput = document.getElementById('cfgLiveSearchInput');
  if (searchInput) {
    searchInput.focus();
    searchInput.select();
  }
}

function assignLocationToSlot(loc) {
  configTempSlots[configActiveSlotIndex] = loc;
  advanceToNextSlot();
}

function assignBestsellerToSlot(name, color, boxContent) {
  configTempSlots[configActiveSlotIndex] = { name, color, boxContent };
  advanceToNextSlot();
}

function assignGridToSlot(name) {
  configTempSlots[configActiveSlotIndex] = name;
  advanceToNextSlot();
}

function saveHotkeyConfig() {
  if (currentConfigType === 'location') {
    hotkeyLocations = [...configTempSlots];
    localStorage.setItem(HOTKEY_STORAGE_KEYS.LOCATION, JSON.stringify(hotkeyLocations));
    renderLocationHotkeys();
  } else if (currentConfigType === 'bestseller') {
    hotkeyBestsellers = configTempSlots.filter(Boolean);
    localStorage.setItem(HOTKEY_STORAGE_KEYS.BESTSELLER, JSON.stringify(hotkeyBestsellers));
    renderBestsellerHotkeys();
  } else if (currentConfigType === 'grid') {
    hotkeyGridItems = [...configTempSlots];
    localStorage.setItem(HOTKEY_STORAGE_KEYS.GRID, JSON.stringify(hotkeyGridItems));
    renderGridHotkeys();
  }

  closeHotkeyConfigModal();
  alert('핫키 슬롯 설정이 성공적으로 저장되었습니다.');
}

function resetCurrentHotkeySlots() {
  if (!confirm('현재 탭의 8개 슬롯을 추천 기본값으로 자동 채우시겠습니까?')) return;
  if (currentConfigType === 'location') {
    autoPopulateLocationHotkeys();
    configTempSlots = [...hotkeyLocations];
  } else if (currentConfigType === 'bestseller') {
    autoPopulateBestsellerHotkeys();
    configTempSlots = hotkeyBestsellers.map(b => b ? { ...b } : null);
  } else if (currentConfigType === 'grid') {
    autoPopulateGridHotkeys();
    configTempSlots = [...hotkeyGridItems];
  }
  configActiveSlotIndex = 0;
  renderConfigSlotChips();
  renderConfigSearchMatrix();
}

function closeHotkeyConfigModal() {
  const modal = document.getElementById('hotkeyConfigModal');
  if (modal) modal.style.display = 'none';
}

// ---------------- 키보드 단축키 이벤트 ----------------

function setupHotkeyShortcuts() {
  window.addEventListener('keydown', (e) => {
    // Alt + Q/W/E : 핫키 탭 전환
    if (e.altKey && !e.shiftKey && !e.ctrlKey) {
      const key = e.key.toLowerCase();
      if (key === 'q') { e.preventDefault(); switchHotkeyTab('location'); return; }
      if (key === 'w') { e.preventDefault(); switchHotkeyTab('bestseller'); return; }
      if (key === 'e') { e.preventDefault(); switchHotkeyTab('grid'); return; }
    }

    // Alt + 1 ~ Alt + 8 : 거래처 핫키 선택
    if (e.altKey && !e.shiftKey && !e.ctrlKey && e.key >= '1' && e.key <= '8') {
      e.preventDefault();
      const idx = parseInt(e.key, 10) - 1;
      selectLocationHotkey(idx);
    }
    // Alt + Shift + 1 ~ 8 : 베스트셀러 핫키 선택
    else if (e.altKey && e.shiftKey && !e.ctrlKey && e.key >= '1' && e.key <= '8') {
      e.preventDefault();
      const idx = parseInt(e.key, 10) - 1;
      selectBestsellerHotkey(idx);
    }
    // Escape : 열린 모달 닫기
    else if (e.key === 'Escape') {
      closeGridSelectionModal();
      closeHotkeyConfigModal();
    }
    // Ctrl + Enter : 그리드 모달이 열려 있을 때 일괄 담기 실행
    else if (e.ctrlKey && e.key === 'Enter') {
      const gridModal = document.getElementById('gridSelectionModal');
      if (gridModal && gridModal.style.display === 'flex') {
        e.preventDefault();
        submitGridSelection();
      }
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initPage();
  initAllHotkeys();
});
window.onload = () => {
  initPage();
  initAllHotkeys();
};
</script>
